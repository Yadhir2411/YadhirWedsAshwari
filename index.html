<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yadhir's Wedding Seating Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', system-ui, sans-serif;
        }
        .title-font {
            font-family: 'Playfair Display', serif;
        }
        .chair-ring {
            width: 260px;
            height: 260px;
            position: relative;
            margin: 0 auto;
        }
        .table-center {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 110px;
            height: 110px;
            background: linear-gradient(135deg, #fefce8, #facc15);
            border: 8px solid #854d0e;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
            z-index: 10;
        }
        .chair {
            position: absolute;
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            border: 3px solid #d97706;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 600;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            user-select: none;
            transition: all 0.2s ease;
        }
        .chair:hover {
            transform: scale(1.15);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
        }
        .chair.occupied {
            background: #fefce8;
            border-color: #854d0e;
            color: #854d0e;
        }
        .modal {
            animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-amber-50 to-rose-50 min-h-screen">
    <div class="max-w-7xl mx-auto p-6">
        <!-- Header -->
        <div class="bg-white rounded-3xl shadow-sm border border-amber-100 p-6 mb-8">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
                <div>
                    <div class="flex items-center gap-3">
                        <div class="w-12 h-12 bg-gradient-to-br from-amber-500 to-pink-500 rounded-2xl flex items-center justify-center text-3xl">💒</div>
                        <div>
                            <h1 class="title-font text-4xl font-bold text-amber-950">Yadhir's Wedding</h1>
                            <p class="text-amber-600">Seating Planner • 200 Guests • 20 Round Tables</p>
                        </div>
                    </div>
                </div>

                <div class="flex flex-wrap gap-3">
                    <button onclick="resetPlan()" 
                            class="px-5 py-3 bg-white border border-amber-300 hover:border-amber-400 rounded-2xl text-sm font-medium flex items-center gap-2">
                        ♻️ Reset All
                    </button>
                    <button onclick="downloadPlan()" 
                            class="px-5 py-3 bg-amber-900 hover:bg-amber-800 text-white rounded-2xl text-sm font-medium flex items-center gap-2">
                        📥 Download JSON
                    </button>
                    <label class="px-5 py-3 bg-white border border-amber-300 hover:border-amber-400 rounded-2xl text-sm font-medium flex items-center gap-2 cursor-pointer">
                        📤 Load Plan
                        <input type="file" id="load-input" accept=".json" class="hidden" onchange="loadPlan(event)">
                    </label>
                    <button onclick="window.print()" 
                            class="px-5 py-3 bg-white border border-amber-300 hover:border-amber-400 rounded-2xl text-sm font-medium flex items-center gap-2">
                        🖨️ Print
                    </button>
                </div>
            </div>

            <!-- Progress -->
            <div class="mt-8 grid grid-cols-1 md:grid-cols-2 gap-8">
                <!-- Groom -->
                <div>
                    <div class="flex items-center justify-between mb-3">
                        <div class="flex items-center gap-2 text-blue-700">
                            👨‍👧‍👦 <span class="font-semibold">GROOM'S FAMILY</span>
                        </div>
                        <span id="groom-count" class="font-mono text-lg font-semibold text-blue-700">0/100</span>
                    </div>
                    <div class="h-3 bg-blue-100 rounded-full overflow-hidden">
                        <div id="groom-bar" class="h-3 bg-blue-600 rounded-full w-0 transition-all"></div>
                    </div>
                </div>
                <!-- Bride -->
                <div>
                    <div class="flex items-center justify-between mb-3">
                        <div class="flex items-center gap-2 text-pink-700">
                            👰‍♀️ <span class="font-semibold">BRIDE'S FAMILY</span>
                        </div>
                        <span id="bride-count" class="font-mono text-lg font-semibold text-pink-700">0/100</span>
                    </div>
                    <div class="h-3 bg-pink-100 rounded-full overflow-hidden">
                        <div id="bride-bar" class="h-3 bg-pink-600 rounded-full w-0 transition-all"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="flex gap-8">
            <!-- Groom Side -->
            <div class="flex-1">
                <div class="bg-blue-600 text-white px-6 py-3 rounded-3xl font-semibold flex items-center gap-2 mb-6">
                    👨‍👧‍👦 GROOM'S FAMILY — Tables G1 to G10 (100 seats)
                </div>
                <div id="groom-grid" class="grid grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-8"></div>
            </div>

            <!-- Divider -->
            <div class="w-px bg-gradient-to-b from-transparent via-amber-300 to-transparent hidden lg:block"></div>

            <!-- Bride Side -->
            <div class="flex-1">
                <div class="bg-pink-600 text-white px-6 py-3 rounded-3xl font-semibold flex items-center gap-2 mb-6">
                    👰‍♀️ BRIDE'S FAMILY — Tables B1 to B10 (100 seats)
                </div>
                <div id="bride-grid" class="grid grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-8"></div>
            </div>
        </div>
    </div>

    <!-- Assign Modal -->
    <div id="modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50">
        <div class="modal bg-white rounded-3xl w-full max-w-md mx-4 shadow-2xl">
            <div class="p-8">
                <h2 id="modal-title" class="text-2xl font-bold text-amber-950"></h2>
                <p id="modal-subtitle" class="text-amber-500 mt-1"></p>
                
                <div class="mt-8">
                    <label class="block text-sm font-medium text-gray-600 mb-2">Guest Name</label>
                    <input id="name-input" type="text" 
                           class="w-full px-6 py-4 border border-amber-200 focus:border-amber-400 rounded-2xl text-lg outline-none"
                           placeholder="e.g. Uncle Rajesh Naidoo">
                </div>
            </div>
            
            <div class="border-t flex">
                <button onclick="hideModal()" 
                        class="flex-1 py-5 text-gray-500 hover:bg-gray-50 font-medium rounded-bl-3xl">Cancel</button>
                <button onclick="saveName()" 
                        class="flex-1 py-5 bg-amber-900 text-white font-medium hover:bg-amber-800 rounded-br-3xl">Save Name</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="hidden fixed bottom-6 right-6 bg-amber-900 text-white px-6 py-4 rounded-2xl shadow-xl flex items-center gap-3">
        <span id="toast-message"></span>
    </div>

    <script>
        let seating = {}
        let currentSeatKey = null

        const tables = []
        for (let i = 1; i <= 10; i++) tables.push({id: `G${i}`, side: 'groom'})
        for (let i = 1; i <= 10; i++) tables.push({id: `B${i}`, side: 'bride'})

        function createTableHTML(table) {
            let chairs = ''
            for (let i = 1; i <= 10; i++) {
                const seatKey = `${table.id}-chair-${i}`
                const name = seating[seatKey] || ''
                const occupied = name ? 'occupied' : ''
                
                const angle = ((i - 1) * 36) - 90
                
                chairs += `
                <div class="chair ${occupied}" 
                     style="transform: rotate(${angle}deg) translateY(-105px) rotate(-${angle}deg);"
                     data-seat="${seatKey}"
                     onclick="openModal('${seatKey}', '${table.id}')"
                     draggable="true"
                     ondragstart="dragStart(event)"
                     ondragover="dragOver(event)"
                     ondrop="drop(event)">
                    ${name ? name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0,2) : '🪑'}
                </div>`
            }

            const assigned = Object.keys(seating).filter(k => k.startsWith(table.id)).length

            return `
            <div class="bg-white rounded-3xl p-6 shadow-sm border border-amber-100 hover:shadow-md">
                <div class="flex justify-between items-center mb-5">
                    <div>
                        <span class="px-3 py-1 text-xs font-medium rounded-full ${table.side === 'groom' ? 'bg-blue-100 text-blue-700' : 'bg-pink-100 text-pink-700'}">
                            ${table.side === 'groom' ? "Groom's Family" : "Bride's Family"}
                        </span>
                        <h3 class="text-3xl font-bold text-amber-950 mt-2">${table.id}</h3>
                    </div>
                    <div class="text-right">
                        <div class="text-xs text-amber-400">10 seats</div>
                        <div class="text-4xl font-semibold text-amber-900">${assigned}<span class="text-amber-300">/10</span></div>
                    </div>
                </div>
                
                <div class="chair-ring mx-auto">
                    <div class="table-center">
                        <div class="text-center">
                            <div class="text-xl font-bold text-amber-800">${table.id}</div>
                            <div class="text-[10px] text-amber-600">ROUND</div>
                        </div>
                    </div>
                    ${chairs}
                </div>
            </div>`
        }

        function renderTables() {
            const groomGrid = document.getElementById('groom-grid')
            const brideGrid = document.getElementById('bride-grid')
            
            groomGrid.innerHTML = ''
            brideGrid.innerHTML = ''
            
            tables.forEach(table => {
                const html = createTableHTML(table)
                if (table.side === 'groom') {
                    groomGrid.innerHTML += html
                } else {
                    brideGrid.innerHTML += html
                }
            })
            
            updateProgress()
        }

        function updateProgress() {
            let groom = 0, bride = 0
            Object.keys(seating).forEach(key => {
                if (key.startsWith('G')) groom++
                else bride++
            })
            
            document.getElementById('groom-count').textContent = `${groom}/100`
            document.getElementById('bride-count').textContent = `${bride}/100`
            
            document.getElementById('groom-bar').style.width = `${(groom/100)*100}%`
            document.getElementById('bride-bar').style.width = `${(bride/100)*100}%`
        }

        function openModal(seatKey, tableId) {
            currentSeatKey = seatKey
            document.getElementById('modal-title').textContent = `${tableId} — Chair ${seatKey.split('-').pop()}`
            document.getElementById('modal-subtitle').textContent = 'Add or change guest name'
            document.getElementById('name-input').value = seating[seatKey] || ''
            document.getElementById('modal').classList.remove('hidden')
            document.getElementById('name-input').focus()
        }

        function hideModal() {
            document.getElementById('modal').classList.add('hidden')
        }

        function saveName() {
            const name = document.getElementById('name-input').value.trim()
            if (currentSeatKey) {
                if (name) {
                    seating[currentSeatKey] = name
                } else {
                    delete seating[currentSeatKey]
                }
            }
            hideModal()
            renderTables()
            showToast(name ? 'Guest assigned ✓' : 'Seat cleared')
        }

        // Drag & Drop
        function dragStart(e) {
            e.dataTransfer.setData('text/plain', e.currentTarget.dataset.seat)
        }
        function dragOver(e) {
            e.preventDefault()
        }
        function drop(e) {
            e.preventDefault()
            const fromKey = e.dataTransfer.getData('text/plain')
            const toKey = e.currentTarget.dataset.seat
            
            if (fromKey === toKey) return
            
            const nameFrom = seating[fromKey]
            const nameTo = seating[toKey]
            
            if (nameFrom) seating[toKey] = nameFrom
            else delete seating[toKey]
            
            if (nameTo) seating[fromKey] = nameTo
            else delete seating[fromKey]
            
            renderTables()
            showToast('Guests moved successfully')
        }

        function showToast(msg) {
            const toast = document.getElementById('toast')
            document.getElementById('toast-message').innerHTML = msg
            toast.classList.remove('hidden')
            setTimeout(() => toast.classList.add('hidden'), 2500)
        }

        function resetPlan() {
            if (confirm('Clear all names and start over?')) {
                seating = {}
                renderTables()
                showToast('Plan reset')
            }
        }

        function downloadPlan() {
            const dataStr = JSON.stringify({seating, exported: new Date().toISOString()}, null, 2)
            const blob = new Blob([dataStr], {type: 'application/json'})
            const url = URL.createObjectURL(blob)
            const a = document.createElement('a')
            a.href = url
            a.download = 'yadhir-wedding-seating-plan.json'
            a.click()
            URL.revokeObjectURL(url)
            showToast('Plan downloaded')
        }

        function loadPlan(e) {
            const file = e.target.files[0]
            if (!file) return
            const reader = new FileReader()
            reader.onload = function(event) {
                try {
                    const data = JSON.parse(event.target.result)
                    if (data.seating) {
                        seating = data.seating
                        renderTables()
                        showToast('Plan loaded successfully')
                    }
                } catch (err) {
                    showToast('Invalid file')
                }
            }
            reader.readAsText(file)
        }

        // Initialize
        window.onload = () => {
            // Load saved data if any
            const saved = localStorage.getItem('yadhirSeating')
            if (saved) seating = JSON.parse(saved)
            
            renderTables()
            
            // Auto-save every 10 seconds
            setInterval(() => {
                localStorage.setItem('yadhirSeating', JSON.stringify(seating))
            }, 10000)
        }
    </script>
</body>
</html>
