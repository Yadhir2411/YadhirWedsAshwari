<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yadhir & Ashwari's Wedding Seating Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', system-ui, sans-serif;
        }
        .title-font {
            font-family: 'Playfair Display', serif;
        }
        
        .table-container {
            width: 280px;
            margin: 0 auto;
        }
        
        .chair-ring {
            position: relative;
            width: 260px;
            height: 260px;
            margin: 0 auto;
        }
        
        .table-center {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 118px;
            height: 118px;
            background: linear-gradient(135deg, #fefce8, #fcd34d);
            border: 10px solid #78350f;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 15px 25px -5px rgba(0, 0, 0, 0.25),
                        inset 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            z-index: 10;
            font-weight: 700;
        }
        
        .chair {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 46px;
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            border: 4px solid #b45309;
            border-radius: 9999px;
            font-size: 13px;
            font-weight: 700;
            color: #451a03;
            box-shadow: 0 8px 15px -3px rgba(0, 0, 0, 0.15),
                        0 2px 4px -2px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            user-select: none;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }
        
        .chair:hover {
            transform: scale(1.18) !important;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
            z-index: 20;
        }
        
        .chair.occupied {
            background: linear-gradient(135deg, #fefce8, #fef08c);
            border-color: #78350f;
            color: #78350f;
        }
        
        .chair .initials {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        
        .modal {
            animation: modalPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        @keyframes modalPop {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-amber-50 via-orange-50 to-rose-50 min-h-screen pb-12">
    <div class="max-w-7xl mx-auto px-6 pt-8">
        <!-- Header -->
        <div class="bg-white rounded-3xl shadow border border-amber-100 p-8 mb-10">
            <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-6">
                <div class="flex items-center gap-4">
                    <div class="w-14 h-14 bg-gradient-to-br from-amber-500 to-pink-500 rounded-3xl flex items-center justify-center text-4xl shadow-inner">💒</div>
                    <div>
                        <h1 class="title-font text-4xl font-bold tracking-tight text-amber-950">Yadhir & Ashwari's Wedding</h1>
                        <p class="text-amber-600 text-lg">Seating Planner • 20 Round Tables • 200 Guests</p>
                    </div>
                </div>
                
                <div class="flex flex-wrap gap-3">
                    <button onclick="resetPlan()" class="px-6 py-3 border border-amber-300 hover:bg-amber-50 rounded-2xl text-sm font-medium flex items-center gap-2">
                        ♻️ Reset All
                    </button>
                    <button onclick="downloadPlan()" class="px-6 py-3 bg-amber-900 hover:bg-amber-800 text-white rounded-2xl text-sm font-medium flex items-center gap-2">
                        📥 Download JSON
                    </button>
                    <label class="px-6 py-3 border border-amber-300 hover:bg-amber-50 rounded-2xl text-sm font-medium flex items-center gap-2 cursor-pointer">
                        📤 Load Plan
                        <input type="file" id="load-input" accept=".json" class="hidden" onchange="loadPlan(event)">
                    </label>
                    <button onclick="window.print()" class="px-6 py-3 border border-amber-300 hover:bg-amber-50 rounded-2xl text-sm font-medium flex items-center gap-2">
                        🖨️ Print View
                    </button>
                </div>
            </div>

            <!-- Progress -->
            <div class="mt-10 grid grid-cols-1 md:grid-cols-2 gap-8">
                <div>
                    <div class="flex justify-between mb-2 text-blue-800">
                        <div class="flex items-center gap-2 font-semibold">👨‍👧‍👦 GROOM'S FAMILY</div>
                        <span id="groom-count" class="font-mono text-xl font-semibold">0/100</span>
                    </div>
                    <div class="h-3 bg-blue-100 rounded-full">
                        <div id="groom-bar" class="h-3 bg-blue-600 rounded-full w-0 transition-all duration-300"></div>
                    </div>
                </div>
                <div>
                    <div class="flex justify-between mb-2 text-pink-800">
                        <div class="flex items-center gap-2 font-semibold">👰‍♀️ BRIDE'S FAMILY</div>
                        <span id="bride-count" class="font-mono text-xl font-semibold">0/100</span>
                    </div>
                    <div class="h-3 bg-pink-100 rounded-full">
                        <div id="bride-bar" class="h-3 bg-pink-600 rounded-full w-0 transition-all duration-300"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="flex flex-col lg:flex-row gap-10">
            <!-- Groom Side -->
            <div class="flex-1">
                <div class="sticky top-6 bg-blue-600 text-white px-8 py-4 rounded-3xl font-semibold flex items-center gap-3 shadow mb-8">
                    👨‍👧‍👦 GROOM'S FAMILY — Tables G1–G10 (100 seats)
                </div>
                <div id="groom-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4 gap-x-8 gap-y-14"></div>
            </div>

            <!-- Visual Divider -->
            <div class="hidden lg:flex flex-col items-center justify-center w-12 text-amber-300">
                <div class="text-center leading-none">
                    <div class="text-4xl mb-2">💃</div>
                    <div class="text-xs tracking-widest font-medium">DANCE</div>
                    <div class="h-px w-8 bg-amber-300 mx-auto my-3"></div>
                    <div class="text-xs tracking-widest font-medium">FLOOR</div>
                </div>
            </div>

            <!-- Bride Side -->
            <div class="flex-1">
                <div class="sticky top-6 bg-pink-600 text-white px-8 py-4 rounded-3xl font-semibold flex items-center gap-3 shadow mb-8">
                    👰‍♀️ BRIDE'S FAMILY — Tables B1–B10 (100 seats)
                </div>
                <div id="bride-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4 gap-x-8 gap-y-14"></div>
            </div>
        </div>
    </div>

    <!-- Assign Modal -->
    <div id="modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50 px-4">
        <div class="modal bg-white rounded-3xl w-full max-w-lg shadow-2xl overflow-hidden">
            <div class="p-8">
                <div id="modal-title" class="text-3xl font-bold text-amber-950"></div>
                <div id="modal-subtitle" class="text-amber-500 mt-1"></div>
                
                <div class="mt-8">
                    <label class="text-sm font-medium text-amber-700 block mb-3">Guest Full Name</label>
                    <input id="name-input" 
                           class="w-full px-6 py-5 text-xl border-2 border-amber-200 focus:border-amber-400 rounded-3xl outline-none"
                           placeholder="e.g. Priya Sharma">
                </div>
            </div>
            
            <div class="flex border-t">
                <button onclick="hideModal()" 
                        class="flex-1 py-6 text-lg font-medium text-gray-500 hover:bg-amber-50">Cancel</button>
                <button onclick="saveName()" 
                        class="flex-1 py-6 text-lg font-medium bg-amber-900 text-white hover:bg-amber-800">Save Assignment</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="hidden fixed bottom-8 right-8 bg-amber-900 text-white px-8 py-4 rounded-3xl shadow-2xl flex items-center gap-3 text-sm font-medium">
        <span id="toast-text"></span>
    </div>

    <script>
        let seating = {}
        let currentSeatKey = null

        const tables = []
        for (let i = 1; i <= 10; i++) tables.push({id: `G${i}`, side: 'groom'})
        for (let i = 1; i <= 10; i++) tables.push({id: `B${i}`, side: 'bride'})

        function createTableHTML(table) {
            let chairsHTML = ''
            
            for (let i = 1; i <= 10; i++) {
                const seatKey = `${table.id}-chair-${i}`
                const name = seating[seatKey] || ''
                const occupied = name ? 'occupied' : ''
                
                // Even spacing for 10 chairs (36 degrees each)
                const angle = (i - 1) * 36
                
                chairsHTML += `
                <div 
                    class="chair ${occupied}"
                    style="transform: translate(-50%, -50%) rotate(${angle}deg) translateY(-118px) rotate(-${angle}deg);"
                    data-seat="${seatKey}"
                    onclick="openModal('${seatKey}', '${table.id}')"
                    draggable="true"
                    ondragstart="dragStart(event)"
                    ondragover="allowDrop(event)"
                    ondrop="handleDrop(event)">
                    ${name ? `<span class="initials">${name.split(' ').map(w => w[0]).join('').toUpperCase().substring(0,2)}</span>` : '🪑'}
                </div>`
            }
            
            const assignedCount = Object.keys(seating).filter(k => k.startsWith(table.id)).length
            
            return `
            <div class="table-container">
                <div class="bg-white rounded-3xl p-7 shadow-sm border border-amber-100">
                    <div class="flex items-center justify-between mb-6">
                        <div>
                            <span class="inline-block px-4 py-1 text-xs font-semibold rounded-2xl ${table.side === 'groom' ? 'bg-blue-100 text-blue-700' : 'bg-pink-100 text-pink-700'}">
                                ${table.side === 'groom' ? "Groom's Family" : "Bride's Family"}
                            </span>
                            <div class="text-4xl font-bold text-amber-950 mt-3">${table.id}</div>
                        </div>
                        <div class="text-right">
                            <div class="text-xs uppercase text-amber-400 tracking-widest">10 chairs</div>
                            <div class="font-mono text-5xl font-semibold text-amber-900">${assignedCount}<span class="text-amber-300 text-3xl">/10</span></div>
                        </div>
                    </div>
                    
                    <div class="chair-ring">
                        <!-- Center Table -->
                        <div class="table-center">
                            <div class="text-center leading-none">
                                <div class="text-2xl text-amber-900">${table.id}</div>
                                <div class="text-[10px] text-amber-700 tracking-[1px] mt-1">ROUND TABLE</div>
                            </div>
                        </div>
                        
                        <!-- Chairs in perfect circle -->
                        ${chairsHTML}
                    </div>
                </div>
            </div>`
        }

        function renderAllTables() {
            const groomContainer = document.getElementById('groom-grid')
            const brideContainer = document.getElementById('bride-grid')
            
            groomContainer.innerHTML = ''
            brideContainer.innerHTML = ''
            
            tables.forEach(table => {
                const html = createTableHTML(table)
                if (table.side === 'groom') {
                    groomContainer.innerHTML += html
                } else {
                    brideContainer.innerHTML += html
                }
            })
            
            updateProgressBars()
        }

        function updateProgressBars() {
            let groomAssigned = 0
            let brideAssigned = 0
            
            Object.keys(seating).forEach(key => {
                if (key[0] === 'G') groomAssigned++
                else brideAssigned++
            })
            
            const groomPct = Math.round((groomAssigned / 100) * 100)
            const bridePct = Math.round((brideAssigned / 100) * 100)
            
            document.getElementById('groom-bar').style.width = `${groomPct}%`
            document.getElementById('bride-bar').style.width = `${bridePct}%`
            
            document.getElementById('groom-count').textContent = `${groomAssigned}/100`
            document.getElementById('bride-count').textContent = `${brideAssigned}/100`
        }

        function openModal(seatKey, tableId) {
            currentSeatKey = seatKey
            const chairNum = seatKey.split('-').pop()
            
            document.getElementById('modal-title').innerHTML = `${tableId} <span class="text-amber-400 text-2xl font-normal">• Chair ${chairNum}</span>`
            document.getElementById('modal-subtitle').textContent = 'Enter the guest name for this seat'
            
            const input = document.getElementById('name-input')
            input.value = seating[seatKey] || ''
            
            document.getElementById('modal').classList.remove('hidden')
            setTimeout(() => input.focus(), 100)
        }

        function hideModal() {
            document.getElementById('modal').classList.add('hidden')
        }

        function saveName() {
            const name = document.getElementById('name-input').value.trim()
            
            if (currentSeatKey) {
                if (name.length > 0) {
                    seating[currentSeatKey] = name
                } else {
                    delete seating[currentSeatKey]
                }
            }
            
            hideModal()
            renderAllTables()
            showToast(name ? '✅ Guest assigned' : '🪑 Seat cleared')
        }

        // Drag & Drop Functions
        function dragStart(e) {
            e.dataTransfer.setData("text/plain", e.currentTarget.getAttribute("data-seat"))
            e.currentTarget.style.opacity = "0.4"
        }
        
        function allowDrop(e) {
            e.preventDefault()
        }
        
        function handleDrop(e) {
            e.preventDefault()
            const fromKey = e.dataTransfer.getData("text/plain")
            const toKey = e.currentTarget.getAttribute("data-seat")
            
            if (fromKey === toKey) {
                renderAllTables()
                return
            }
            
            const nameFrom = seating[fromKey]
            const nameTo = seating[toKey]
            
            // Perform swap / move
            if (nameFrom) seating[toKey] = nameFrom
            else delete seating[toKey]
            
            if (nameTo) seating[fromKey] = nameTo
            else delete seating[fromKey]
            
            renderAllTables()
            showToast('👥 Guests swapped')
        }

        function showToast(message) {
            const toast = document.getElementById('toast')
            document.getElementById('toast-text').innerHTML = message
            toast.classList.remove('hidden')
            setTimeout(() => {
                toast.classList.add('hidden')
            }, 2200)
        }

        function resetPlan() {
            if (confirm('Clear every name and start a fresh seating plan?')) {
                seating = {}
                renderAllTables()
                showToast('Plan reset to empty')
            }
        }

        function downloadPlan() {
            const data = {
                wedding: "Yadhir's Wedding",
                date: new Date().toISOString(),
                seating: seating
            }
            const blob = new Blob([JSON.stringify(data, null, 2)], {type: "application/json"})
            const url = URL.createObjectURL(blob)
            const link = document.createElement('a')
            link.href = url
            link.download = `yadhir-wedding-seating-${new Date().toISOString().slice(0,10)}.json`
            link.click()
            URL.revokeObjectURL(url)
            showToast('📄 Plan downloaded')
        }

        function loadPlan(event) {
            const file = event.target.files[0]
            if (!file) return
            
            const reader = new FileReader()
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result)
                    if (data.seating) {
                        seating = data.seating
                        renderAllTables()
                        showToast('✅ Plan loaded successfully')
                    }
                } catch (err) {
                    showToast('❌ Invalid file format')
                }
            }
            reader.readAsText(file)
        }

        // Auto-save to browser storage
        function autoSave() {
            localStorage.setItem('yadhirWeddingSeating2026', JSON.stringify(seating))
        }

        // Load from storage on start
        window.onload = function() {
            const savedData = localStorage.getItem('yadhirWeddingSeating2026')
            if (savedData) {
                try {
                    seating = JSON.parse(savedData)
                } catch(e) {}
            }
            
            renderAllTables()
            
            // Auto-save every 8 seconds
            setInterval(autoSave, 8000)
            
            console.log('%cWedding Seating Planner ready ✓\nClick any chair → add name\nDrag names between chairs to rearrange', 'color:#c2410c; font-family:monospace')
        }
    </script>
</body>
</html>
